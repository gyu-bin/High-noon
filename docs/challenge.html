<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>High Noon — Friend Challenge</title>
<meta name="description" content="너 반응속도 몇 ms야? 친구의 High Noon 도전장을 열고 결투하세요." />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #1a0d16 0%, #3a1810 45%, #6e3216 100%);
    color: #f5e6c8;
    min-height: 100vh;
    line-height: 1.65;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 56px 24px 80px; text-align: center; }
  .title {
    font-size: clamp(36px, 9vw, 56px);
    letter-spacing: 3px;
    font-weight: 800;
    color: #f0ba4a;
    text-shadow: 0 3px 0 rgba(0,0,0,0.5);
    margin: 0;
  }
  .tag { margin-top: 10px; color: #d6b080; font-size: 15px; letter-spacing: 1px; }
  .rule { width: 120px; height: 3px; background: #f0ba4a; border: 0; margin: 22px auto; opacity: 0.85; }
  .card {
    background: rgba(10,5,3,0.42);
    border: 1px solid rgba(240,186,74,0.28);
    border-radius: 16px;
    padding: 22px 20px;
    margin-top: 18px;
  }
  .code {
    font-size: 40px;
    letter-spacing: 6px;
    font-weight: 800;
    color: #f0ba4a;
    margin: 8px 0 4px;
  }
  .hint { color: #d8c4a4; font-size: 14px; margin: 0; }
  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 14px 22px;
    border-radius: 12px;
    background: #c47a2a;
    color: #1a0c06;
    font-weight: 800;
    text-decoration: none;
    letter-spacing: 0.4px;
  }
  .btn.secondary {
    background: transparent;
    border: 1px solid rgba(240,186,74,0.45);
    color: #f5c869;
    margin-left: 8px;
  }
  .steps { text-align: left; margin: 28px 0 0; padding-left: 18px; color: #f0e2c6; }
  footer { margin-top: 48px; color: #b08a5c; font-size: 13px; }
  footer a { color: #cfa46a; }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">HIGH NOON</h1>
    <div class="tag">너 반응속도 몇 ms야?</div>
    <hr class="rule" />

    <div class="card">
      <div class="hint">친구 도전 코드</div>
      <div class="code" id="code">------</div>
      <p class="hint" id="status">앱이 있으면 바로 도전장을 엽니다.</p>
      <div>
        <a class="btn" id="openApp" href="#">앱에서 열기</a>
        <a class="btn secondary" id="store" href="https://apps.apple.com/app/id6762042961">App Store</a>
      </div>
    </div>

    <ol class="steps">
      <li>High Noon 앱을 설치합니다.</li>
      <li>랭킹 → <strong>친구 도전장 입장</strong>을 엽니다.</li>
      <li>위 6자리 코드를 입력하고 결투합니다.</li>
    </ol>

    <footer>
      <a href="./privacy.html">Privacy</a> ·
      <a href="./index.html">Support</a>
    </footer>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = String(params.get('code') || '')
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '')
        .slice(0, 6);
      var codeEl = document.getElementById('code');
      var openApp = document.getElementById('openApp');
      var statusEl = document.getElementById('status');

      if (code.length === 6) {
        codeEl.textContent = code;
        var deep = 'high-noon://ranking/challenge?code=' + encodeURIComponent(code);
        openApp.href = deep;
        // Try open app immediately; if not installed user stays on this page.
        window.setTimeout(function () {
          window.location.href = deep;
        }, 400);
      } else {
        codeEl.textContent = '??????';
        statusEl.textContent = '유효한 도전 코드가 없습니다. 공유받은 링크를 다시 열어주세요.';
        openApp.style.display = 'none';
      }
    })();
  </script>
</body>
</html>
